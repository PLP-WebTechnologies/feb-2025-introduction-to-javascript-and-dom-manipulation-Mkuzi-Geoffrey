<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Webpage</title>
    <link rel="stylesheet" href="stles.css">
</head>
<body>
    <header>
        <h1>Dynamic Content Example</h1>
    </header>

    <main>
        <section>
            <p id="greeting">Hello there!</p>
            <button id="changeTextButton">Change Text</button>
        </section>

        <section>
            <div id="styledElement">This text will be styled.</div>
            <button id="toggleStyleButton">Toggle Style</button>
        </section>

        <section>
            <h2>Element Manipulation</h2>
            <button id="addElementButton">Add Item</button>
            <button id="removeElementButton">Remove Item</button>
            <ul id="itemList">
                <li id="initialItem">Initial List Item</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Dynamic Content Example</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
